name: Dinnertime

options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Dinnertime:
    type: application
    platform: iOS
    sources:
      - App
      - Brand
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, de]
        UILaunchScreen:
          UIColorName: Paper
        UIAppFonts:
          - BricolageGrotesque.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Lets the app reach the server in your home network and share the shopping list with phones nearby.
        NSBonjourServices:
          - _mealplan-shop._tcp
          - _mealplan-shop._udp
        KeychainService: $(APP_BUNDLE_ID)
        KeychainGroup: $(KEYCHAIN_GROUP)
        KeychainGroupPrefix: $(AppIdentifierPrefix)
        AppGroup: $(APP_GROUP)
    entitlements:
      path: App/Dinnertime.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(KEYCHAIN_GROUP)
        com.apple.security.application-groups:
          - $(APP_GROUP)
    dependencies:
      - target: DinnertimeKit
      - target: ShareExtension

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Brand
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).share
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, de]
        UIAppFonts:
          - BricolageGrotesque.ttf
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        KeychainService: $(APP_BUNDLE_ID)
        KeychainGroup: $(KEYCHAIN_GROUP)
        KeychainGroupPrefix: $(AppIdentifierPrefix)
        AppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(KEYCHAIN_GROUP)
        com.apple.security.application-groups:
          - $(APP_GROUP)
    dependencies:
      - target: DinnertimeKit
        embed: false

  DinnertimeKit:
    type: framework
    platform: iOS
    sources:
      - Kit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).kit
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  DinnertimeKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).kit.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DinnertimeKit

  DinnertimeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Dinnertime

schemes:
  DinnertimeUITests:
    build:
      targets:
        Dinnertime: all
        DinnertimeUITests: [test]
    test:
      config: Debug
      targets:
        - DinnertimeUITests
  Dinnertime:
    build:
      targets:
        Dinnertime: all
        DinnertimeKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DinnertimeKitTests
    archive:
      config: Release
