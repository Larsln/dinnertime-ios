name: Mealplanner

options:
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Mealplanner:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, de]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Lets the app reach a server in your home network.
        KeychainService: $(APP_BUNDLE_ID)
        KeychainGroup: $(KEYCHAIN_GROUP)
        KeychainGroupPrefix: $(AppIdentifierPrefix)
        AppGroup: $(APP_GROUP)
    entitlements:
      path: App/Mealplanner.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(KEYCHAIN_GROUP)
        com.apple.security.application-groups:
          - $(APP_GROUP)
    dependencies:
      - target: MealplannerKit
      - target: ShareExtension

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).share
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, de]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        KeychainService: $(APP_BUNDLE_ID)
        KeychainGroup: $(KEYCHAIN_GROUP)
        KeychainGroupPrefix: $(AppIdentifierPrefix)
        AppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(KEYCHAIN_GROUP)
        com.apple.security.application-groups:
          - $(APP_GROUP)
    dependencies:
      - target: MealplannerKit
        embed: false

  MealplannerKit:
    type: framework
    platform: iOS
    sources:
      - Kit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).kit
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  MealplannerKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).kit.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MealplannerKit

  MealplannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Mealplanner

schemes:
  MealplannerUITests:
    build:
      targets:
        Mealplanner: all
        MealplannerUITests: [test]
    test:
      config: Debug
      targets:
        - MealplannerUITests
  Mealplanner:
    build:
      targets:
        Mealplanner: all
        MealplannerKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MealplannerKitTests
    archive:
      config: Release
